name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  precommit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install hatch
        run: uv tool install hatch

      - name: Run pre-commit
        run: hatch run pre-commit:ci

  test:
    name: "Test / Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6
        with:
          # Required for hatch-vcs to resolve the version from tags
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install hatch
        run: uv tool install hatch

      - name: Run tests
        run: |
          hatch test --python ${{ matrix.python-version }} --cover
          hatch run hatch-test.py${{ matrix.python-version }}:cov-report-markdown >> $GITHUB_STEP_SUMMARY

      - name: Rename coverage files
        run: for f in .coverage*; do mv "$f" "$f.${{ matrix.python-version }}"; done

      - name: Upload coverage files
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: .coverage*
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: ignore

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install hatch
        run: uv tool install hatch

      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage*
          merge-multiple: true

      - name: Combine and report
        run: |
          hatch run hatch-test.py3.12:cov-combine
          hatch run hatch-test.py3.12:cov-report
          hatch run hatch-test.py3.12:cov-report-markdown >> $GITHUB_STEP_SUMMARY

      - name: Upload HTML report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: htmlcov/

  build:
    name: Build & publish to TestPyPI
    runs-on: ubuntu-latest
    needs: [precommit, test]
    # Only publish on pushes to main, not on PRs
    if: github.event_name == 'push' || github.event_name == 'workflow_call'
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install hatch
        run: uv tool install hatch

      - name: Build unique dev version
        run: |
          BASE=$(hatch version | sed 's/\.dev[0-9]*//')
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=${BASE}.dev$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV

      - name: Build
        run: hatch build

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
